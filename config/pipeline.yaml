pipeline:
  name: digercic_etl
  description: Pipeline ETL Oracle a PostgreSQL
  version: "4.0.0"
  parallel: false

extractions:
  - name: cedulados_msp
    source: oracle
    config:
      host: ${ORACLE_HOST_MSP}
      port: ${ORACLE_PORT_MSP}
      service: ${ORACLE_SERVICE_MSP}
      user: ${ORACLE_USER_MSP}
      password: ${ORACLE_PASSWORD_MSP}
      instant_client_dir: ${ORACLE_INSTANT_CLIENT_DIR_MSP}
    query: SELECT * FROM HCUE_SEGNOMINAL.VM_CONTROLES_NINOS_GESTANTES
    params: {}

  - name: atenciones_ninos_hcue
    source: oracle
    config:
      host: ${ORACLE_HOST_MSP}
      port: ${ORACLE_PORT_MSP}
      service: ${ORACLE_SERVICE_MSP}
      user: ${ORACLE_USER_MSP}
      password: ${ORACLE_PASSWORD_MSP}
      instant_client_dir: ${ORACLE_INSTANT_CLIENT_DIR_MSP}
    query: SELECT * FROM HCUE_REPOSITORIO.VM_ATENCIONES_NINOS_HCUE
    params: {}

transformations:
  enabled: false

loads:
  - name: cedulados_msp_to_postgres
    source: cedulados_msp
    target: postgresql
    config:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      database: ${POSTGRES_DATABASE}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      truncate_before_load: "true"
    table: cedulados_prueba_msp
    mode: insert

  - name: atenciones_ninos_to_postgres
    source: atenciones_ninos_hcue
    target: postgresql
    config:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      database: ${POSTGRES_DATABASE}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      truncate_before_load: "true"
    table: atenciones_ninos_hcue_pruebas
    mode: insert

logging:
  level: INFO
  file: logs/digercic_etl.log
