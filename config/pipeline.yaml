# ============================
# ETL DIGERCIC - Oracle 11g -> PostgreSQL
# Prueba con tabla CEDULADO
# ============================

pipeline:
  name: "digercic_etl"
  description: "Pipeline ETL Oracle 11g a PostgreSQL"
  version: "3.1.0"
  parallel: false

# ============================
# EXTRACCIONES
# ============================
extractions:
  - name: cedulados_oracle
    source: oracle
    config:
      host: ${ORACLE_HOST}
      port: ${ORACLE_PORT}
      service: ${ORACLE_SERVICE}
      user: ${ORACLE_USER}
      password: ${ORACLE_PASSWORD}
      batch_size: 50000
      instant_client_dir: ${ORACLE_INSTANT_CLIENT_DIR}
    query: "SELECT * FROM INTEROPERABILIDAD.CEDULADO_MIN_DESARROLLO_HUMANO"
    params: {}

# ============================
# TRANSFORMACIONES
# ============================
transformations:
  enabled: false

# ============================
# CARGAS
# ============================
loads:
  - name: cedulados_to_postgres
    source: cedulados_oracle
    target: postgresql
    config:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      database: ${POSTGRES_DATABASE}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      batch_size: 5000
      truncate_before_load: true
    table: "cedulados_prueba"
    mode: insert

# ============================
# LOGGING
# ============================
logging:
  level: INFO
  file: "logs/digercic_etl.log"
