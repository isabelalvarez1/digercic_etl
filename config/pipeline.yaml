# ============================
# ETL DIGERCIC - Oracle -> PostgreSQL
# Multi-tabla con lotes usando Polars
# ============================

pipeline:
  name: "digercic_etl"
  description: "Pipeline ETL Oracle a PostgreSQL"
  version: "3.0.0"
  parallel: false

# ============================
# EXTRACCIONES
# ============================
extractions:
  # Tabla CLIENTES
  - name: clientes_oracle
    source: oracle
    config:
      host: ${ORACLE_HOST}
      port: ${ORACLE_PORT}
      service: ${ORACLE_SERVICE}
      user: ${ORACLE_USER}
      password: ${ORACLE_PASSWORD}
      batch_size: 50000
    query: "SELECT * FROM CLIENTES"
    params: {}

  # Tabla CAPTACIONES
  - name: captaciones_oracle
    source: oracle
    config:
      host: ${ORACLE_HOST}
      port: ${ORACLE_PORT}
      service: ${ORACLE_SERVICE}
      user: ${ORACLE_USER}
      password: ${ORACLE_PASSWORD}
      batch_size: 50000
    query: "SELECT * FROM CAPTACIONES"
    params: {}

# ============================
# TRANSFORMACIONES
# ============================
transformations:
  enabled: false

# ============================
# CARGAS
# ============================
loads:
  # Carga CLIENTES a PostgreSQL
  - name: clientes_to_postgres
    source: clientes_oracle
    target: postgresql
    config:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      database: ${POSTGRES_DATABASE}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      batch_size: 5000
      truncate_before_load: true
      # NO se necesita column_mapping para CAMPAA
      # La estandarizacion automatica convierte:
      # CAMPA\ufffd\ufffdA → campana
      # CAMPAÑA → campana
    table: "clientes"
    mode: insert

  # Carga CAPTACIONES a PostgreSQL
  - name: captaciones_to_postgres
    source: captaciones_oracle
    target: postgresql
    config:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      database: ${POSTGRES_DATABASE}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      batch_size: 5000
      truncate_before_load: true
      # column_mapping solo para renombrar explicitamente:
      column_mapping:
        FUENTE: red_social
    table: "captaciones"
    mode: insert

# ============================
# LOGGING
# ============================
logging:
  level: INFO
  file: "logs/digercic_etl.log"
